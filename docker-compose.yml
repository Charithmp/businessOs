services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_os
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: business_os
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_os -d business_os"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
